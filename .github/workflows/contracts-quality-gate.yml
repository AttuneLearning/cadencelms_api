name: Contracts Quality Gate

on:
  pull_request:
    paths:
      - 'contracts/**'
      - 'scripts/**'
      - '.github/workflows/contracts-quality-gate.yml'
      - 'package.json'
      - 'package-lock.json'
  push:
    branches:
      - main
      - develop
    paths:
      - 'contracts/**'
      - 'scripts/**'
      - '.github/workflows/contracts-quality-gate.yml'
      - 'package.json'
      - 'package-lock.json'

jobs:
  contracts:
    name: Validate/Export/Docs
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate contracts
        run: npm run contracts:validate

      - name: Export contracts
        run: npm run contracts:export

      - name: Generate OpenAPI docs
        run: npm run contracts:docs
